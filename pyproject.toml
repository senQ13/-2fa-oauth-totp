[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager-api"
version = "0.1.0"
description = "FastAPI backend for Task Manager"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "You", email = "you@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

# --- Зависимости приложения (устанавливаются в прод) ---
dependencies = [
    "fastapi[standard]>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    "httpx>=0.27",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.54.0",
]

# --- Зависимости для разработки (тесты, линтеры, типы) ---
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "types-requests",
    "types-python-jose",
]

# --- Конфиги инструментов ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "ARG", "PTH", "TRY", "SIM", "T20"
]
ignore = ["ARG001", "ARG002"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy", "sqlalchemy.mypy"]

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.alembic]
# script_location = "app/db/migrations"  # раскомментируй после alembic init